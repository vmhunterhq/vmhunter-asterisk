; =============================================================================
; VM Hunter — CALLGUARD (call screening) test route for VICIdial / Asterisk
; =============================================================================
;
; What it does
;   Normal calls behave exactly like the production extension 8370.
;   Calls where VM Hunter detects call screening (iPhone "Ask Reason for Calling",
;   "who is calling", "screened by Google", ...) play a short recorded intro so
;   the screener hears who is calling, then connect to an agent.
;
; How the branch works
;   The VM Hunter server labels screened calls with AMDCAUSE=CALLGUARD_PHRASE:<phrase>.
;   By default it sends AMDSTATUS=MACHINE for them, so every
;   other campaign and customer keeps hanging up on them. This extension checks
;   AMDCAUSE instead of AMDSTATUS, so it catches screened calls in both server
;   modes (MACHINE or CALLGUARD reply) and with any vmhunter.agi.py settings.
;
; Install
;   1. Record the intro and convert it to 8 kHz mono (Asterisk cannot play MP3):
;        sox intro.mp3 -r 8000 -c 1 -b 16 -e signed-integer \
;            /var/lib/asterisk/sounds/vmhunter-callguard-intro.wav
;      Keep it short (3–5 s) and say the company name and reason clearly, e.g.
;      "Hi, this is Acme Health calling about your appointment."
;      If the file is missing, Playback fails and Asterisk hangs up the call.
;   2. Paste the extension below into /etc/asterisk/extensions.conf, in the same
;      context as your existing 8370 extension.
;   3. asterisk -rx "dialplan reload"
;   4. Point ONE test campaign's routing extension at 8371. Leave production
;      campaigns on 8370.
;
; Watch it
;   asterisk -rvvv   then look for the "VMHUNTER" NoOp lines.
;
; Before using a recorded intro on live traffic, check the TCPA / prerecorded
; message rules for your campaigns with counsel.
; =============================================================================

exten => 8371,1,AGI(agi://127.0.0.1:4577/call_log)
exten => 8371,n,Playback(sip-silence)
exten => 8371,n,EAGI(/var/lib/asterisk/agi-bin/vmhunter.agi.py,${VID})
exten => 8371,n,NoOp(VMHUNTER AMDSTATUS=${AMDSTATUS} RAW=${AMDSTATUS_RAW} CAUSE=${AMDCAUSE})
; Call screening? AMDCAUSE starts with "CALLGUARD" (CALLGUARD_PHRASE:<phrase>)
exten => 8371,n,GotoIf($["${AMDCAUSE:0:9}" = "CALLGUARD"]?callguard)

; ---- Not screened: same as production 8370 --------------------------------
exten => 8371,n,AGI(VD_amd.agi,${EXTEN})
exten => 8371,n,AGI(agi-VDAD_ALL_outbound.agi,NORMAL-----LB-----${CONNECTEDLINE(name)})
exten => 8371,n,Hangup()

; ---- Screened: play the intro, then connect an agent ----------------------
exten => 8371,n(callguard),NoOp(VMHUNTER CALLGUARD ${AMDCAUSE}: playing intro, then agent)
exten => 8371,n,Playback(vmhunter-callguard-intro)
; VD_amd.agi drops the call when AMDSTATUS=MACHINE. Mark it HUMAN so VICIdial
; logs it and lets it through to an agent.
exten => 8371,n,Set(AMDSTATUS=HUMAN)
exten => 8371,n,AGI(VD_amd.agi,${EXTEN})
exten => 8371,n,AGI(agi-VDAD_ALL_outbound.agi,NORMAL-----LB-----${CONNECTEDLINE(name)})
exten => 8371,n,Hangup()
